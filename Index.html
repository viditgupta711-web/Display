<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clock &amp; Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ---------------------------------------------------------------
     Warm-filament palette. Amber on true black: black pixels are
     switched off on OLED, and a single warm hue keeps the panel
     ageing evenly and stays kind to the eyes after dark.
     --------------------------------------------------------------- */
  :root {
    --ink:        #000000;
    --filament:   #E8A33D;
    --filament-2: #F2C489;
    --ember:      #8A5C22;
    --ash:        #4A3115;
    --wet:        #5F9EA8;   /* used only for precipitation */
    --pad: clamp(18px, 4vmin, 44px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--ink);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: "Chakra Petch", "Roboto Condensed", system-ui, sans-serif;
    color: var(--filament);
    display: grid;
    place-items: center;
  }

  /* Slow orbit: the whole panel drifts on a 15-minute cycle so no
     pixel holds the same glyph. Protective, not decorative — it runs
     even under reduced-motion. */
  @keyframes drift {
    0%   { transform: translate(-11px, -7px); }
    25%  { transform: translate(10px, -9px); }
    50%  { transform: translate(12px, 8px); }
    75%  { transform: translate(-9px, 10px); }
    100% { transform: translate(-11px, -7px); }
  }

  #panel {
    width: 100%;
    height: 100%;
    padding: var(--pad);
    animation: drift 900s ease-in-out infinite;
    transition: opacity 4s linear;
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 2.5vmin, 26px);
  }

  #main {
    flex: 1;
    display: flex;
    align-items: center;
    gap: clamp(16px, 5vmin, 60px);
    min-height: 0;
  }

  /* ---- Time block ---- */
  #timeblock { flex: 1 1 58%; min-width: 0; }

  #time {
    font-weight: 300;
    font-size: clamp(76px, 26vmin, 320px);
    line-height: 0.84;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--filament-2);
    display: flex;
    align-items: baseline;
  }
  #time .sep {
    color: var(--ember);
    padding: 0 0.04em;
  }

  #date {
    margin-top: clamp(8px, 2vmin, 20px);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: clamp(12px, 2.6vmin, 24px);
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--ember);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---- Weather block ---- */
  #weather {
    flex: 0 1 42%;
    min-width: 0;
    border-left: 1px solid rgba(138, 92, 34, 0.45);
    padding-left: clamp(14px, 4vmin, 44px);
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 1.6vmin, 16px);
  }

  #wxtop { display: flex; align-items: center; gap: clamp(8px, 2vmin, 20px); }

  #icon { width: clamp(34px, 9vmin, 92px); height: clamp(34px, 9vmin, 92px); flex: none; }
  #icon svg { width: 100%; height: 100%; display: block; }
  #icon path, #icon circle, #icon line { 
    fill: none; 
    stroke: var(--filament); 
    stroke-width: 5; 
    stroke-linecap: round; 
    stroke-linejoin: round; 
  }
  #icon .rain { stroke: var(--wet); }

  #temp {
    font-weight: 500;
    font-size: clamp(40px, 12vmin, 132px);
    line-height: 0.9;
    font-variant-numeric: tabular-nums;
    color: var(--filament-2);
  }
  #temp span { font-size: 0.42em; color: var(--ember); vertical-align: super; }

  #cond {
    font-size: clamp(15px, 3.2vmin, 34px);
    font-weight: 500;
    color: var(--filament);
    line-height: 1.15;
  }

  #place {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: clamp(10px, 1.9vmin, 17px);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ash);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .rows {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: clamp(11px, 2.1vmin, 19px);
    color: var(--ember);
    display: flex;
    flex-direction: column;
    gap: 0.45em;
  }
  .rows div { display: flex; justify-content: space-between; gap: 1.2em; }
  .rows b { font-weight: 500; color: var(--filament); }
  .rows b.wet { color: var(--wet); }

  /* ---- Day arc: the signature. A hairline spanning sunrise to
     sunset with a travelling filament marking where the daylight
     currently stands. Outside daylight the band goes cold. ---- */
  #arc {
    flex: none;
    height: clamp(26px, 6vmin, 52px);
    position: relative;
  }
  #track {
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 1px;
    background: linear-gradient(to right,
      rgba(74,49,21,0) 0%, var(--ash) 6%, var(--ash) 94%, rgba(74,49,21,0) 100%);
  }
  #band {
    position: absolute;
    top: 50%;
    height: 1px;
    background: var(--ember);
    transition: opacity 2s linear;
  }
  #marker {
    position: absolute;
    top: 50%;
    width: 3px; height: 3px;
    margin: -1px 0 0 -1.5px;
    border-radius: 50%;
    background: var(--filament-2);
    box-shadow: 0 0 10px 2px rgba(232,163,61,0.55);
    transition: left 2s linear;
  }
  .edge {
    position: absolute;
    top: calc(50% + 9px);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: clamp(9px, 1.7vmin, 15px);
    letter-spacing: 0.16em;
    color: var(--ash);
  }
  #riseLbl { left: 0; }
  #setLbl  { right: 0; }

  #status {
    position: absolute;
    top: calc(50% + 9px);
    left: 50%;
    transform: translateX(-50%);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: clamp(9px, 1.7vmin, 15px);
    letter-spacing: 0.16em;
    color: var(--ash);
    text-transform: uppercase;
    white-space: nowrap;
  }
  #status.warn { color: var(--ember); }

  /* ---- Portrait: stack, weather below the clock ---- */
  @media (orientation: portrait) {
    #main { flex-direction: column; align-items: stretch; justify-content: center; }
    #timeblock { flex: none; }
    #time { font-size: clamp(76px, 21vmin, 240px); }
    #weather {
      flex: none;
      border-left: none;
      border-top: 1px solid rgba(138, 92, 34, 0.45);
      padding-left: 0;
      padding-top: clamp(14px, 4vmin, 40px);
    }
    #temp { font-size: clamp(48px, 16vmin, 150px); }
  }
</style>
</head>
<body>

<div id="panel">
  <div id="main">
    <div id="timeblock">
      <div id="time">--<span class="sep">:</span>--</div>
      <div id="date">&nbsp;</div>
    </div>

    <div id="weather">
      <div id="place">Locating</div>
      <div id="wxtop">
        <div id="icon"></div>
        <div id="temp">--<span>°</span></div>
      </div>
      <div id="cond">Waiting for weather</div>
      <div class="rows">
        <div><span>Feels like</span><b id="feels">--°</b></div>
        <div><span>High / low</span><b id="hilo">--° / --°</b></div>
        <div><span>Rain chance</span><b id="pop" class="wet">--%</b></div>
        <div><span>Wind</span><b id="wind">-- mph</b></div>
      </div>
    </div>
  </div>

  <div id="arc">
    <div id="track"></div>
    <div id="band"></div>
    <div id="marker"></div>
    <div class="edge" id="riseLbl"></div>
    <div class="edge" id="setLbl"></div>
    <div id="status">Connecting</div>
  </div>
</div>

<script>
/* =================================================================
   SETTINGS — edit the two numbers below for a different location.
   Or pass them in the URL:  file:///...?lat=51.72&lon=-1.22
   ================================================================= */
const UNITS = { temp: 'celsius', wind: 'mph' };

// Used only if GPS is denied and the network lookup fails too.
const FALLBACK = { lat: 51.7192, lon: -1.2177, name: 'Oxford' };

// Override at any time with:  ?lat=51.72&lon=-1.22&name=Home
const params = new URLSearchParams(location.search);

/* ---------- Clock ---------- */
const timeEl = document.getElementById('time');
const dateEl = document.getElementById('date');

function pad(n) { return n < 10 ? '0' + n : '' + n; }

function drawClock() {
  const now = new Date();
  timeEl.innerHTML = pad(now.getHours()) + '<span class="sep">:</span>' + pad(now.getMinutes());
  dateEl.textContent = now.toLocaleDateString('en-GB', {
    weekday: 'long', day: 'numeric', month: 'long'
  });
  applyDimming(now);
  moveMarker(now);
}

/* ---------- Night dimming: the panel eases down after 21:30 and
     back up at 06:30, so it never glares in a dark room. ---------- */
const panel = document.getElementById('panel');
function applyDimming(now) {
  const h = now.getHours() + now.getMinutes() / 60;
  let level;
  if (h >= 21.5 || h < 6.5)      level = 0.34;
  else if (h < 7.5)              level = 0.34 + (h - 6.5) * 0.66;
  else if (h > 20.5)             level = 1 - (h - 20.5) * 0.66;
  else                           level = 1;
  panel.style.opacity = level.toFixed(2);
}

/* ---------- Weather ---------- */
const WX = {
  0:  ['Clear',           'clear'],
  1:  ['Mainly clear',    'partly'],
  2:  ['Partly cloudy',   'partly'],
  3:  ['Overcast',        'cloud'],
  45: ['Fog',             'fog'],
  48: ['Freezing fog',    'fog'],
  51: ['Light drizzle',   'rain'],
  53: ['Drizzle',         'rain'],
  55: ['Heavy drizzle',   'rain'],
  56: ['Freezing drizzle','rain'],
  57: ['Freezing drizzle','rain'],
  61: ['Light rain',      'rain'],
  63: ['Rain',            'rain'],
  65: ['Heavy rain',      'rain'],
  66: ['Freezing rain',   'rain'],
  67: ['Freezing rain',   'rain'],
  71: ['Light snow',      'snow'],
  73: ['Snow',            'snow'],
  75: ['Heavy snow',      'snow'],
  77: ['Snow grains',     'snow'],
  80: ['Rain showers',    'rain'],
  81: ['Rain showers',    'rain'],
  82: ['Heavy showers',   'rain'],
  85: ['Snow showers',    'snow'],
  86: ['Snow showers',    'snow'],
  95: ['Thunderstorm',    'storm'],
  96: ['Thunderstorm',    'storm'],
  99: ['Thunderstorm',    'storm']
};

const CLOUD = 'M28 76 h44 a17 17 0 0 0 2-34 a25 25 0 0 0-47-8 a16 16 0 0 0-1 42 z';

function icon(kind, isDay) {
  switch (kind) {
    case 'clear':
      return isDay
        ? `<circle cx="50" cy="50" r="18"/>
           <path d="M50 14v10M50 76v10M14 50h10M76 50h10M25 25l7 7M68 68l7 7M75 25l-7 7M32 68l-7 7"/>`
        : `<path d="M62 20a32 32 0 1 0 18 40 26 26 0 0 1-18-40z"/>`;
    case 'partly':
      return `<circle cx="35" cy="36" r="13"/>
              <path d="M35 12v8M35 52v3M11 36h8M51 36h4M19 20l5 5M19 52l5-5"/>
              <path d="${CLOUD}"/>`;
    case 'cloud':
      return `<path d="${CLOUD}"/>`;
    case 'fog':
      return `<path d="${CLOUD}"/><path d="M18 88h64M28 96h44"/>`;
    case 'rain':
      return `<path d="${CLOUD}"/>
              <path class="rain" d="M35 84l-5 12M52 84l-5 12M69 84l-5 12"/>`;
    case 'snow':
      return `<path d="${CLOUD}"/>
              <path d="M34 88v10M29 91l10 6M39 91l-10 6M66 88v10M61 91l10 6M71 91l-10 6"/>`;
    case 'storm':
      return `<path d="${CLOUD}"/><path d="M53 82L38 98h14l-4 12"/>`;
    default:
      return `<path d="${CLOUD}"/>`;
  }
}

const el = {
  icon:  document.getElementById('icon'),
  temp:  document.getElementById('temp'),
  cond:  document.getElementById('cond'),
  feels: document.getElementById('feels'),
  hilo:  document.getElementById('hilo'),
  pop:   document.getElementById('pop'),
  wind:  document.getElementById('wind'),
  place: document.getElementById('place'),
  status: document.getElementById('status'),
  band:  document.getElementById('band'),
  marker: document.getElementById('marker'),
  rise:  document.getElementById('riseLbl'),
  set:   document.getElementById('setLbl')
};

let sunrise = null, sunset = null, lastGood = null;
let spot = null;

/* ---------- Where are we? ------------------------------------------
   Three ways in, best first. The device never moves, so once a fix
   lands it is remembered and reused on every boot.
   1. GPS / Wi-Fi positioning, if the browser is allowed it
   2. Network lookup by IP — no permission needed, accurate to the
      nearest town or so
   3. The fallback constant above
   ------------------------------------------------------------------ */

function remember(s) {
  try { localStorage.setItem('spot', JSON.stringify(s)); } catch (e) {}
}
function recall() {
  try { return JSON.parse(localStorage.getItem('spot')); } catch (e) { return null; }
}

function fromGPS() {
  return new Promise(function (resolve) {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      function (p) {
        resolve({ lat: p.coords.latitude, lon: p.coords.longitude, name: null, src: 'gps' });
      },
      function () { resolve(null); },
      { enableHighAccuracy: false, timeout: 12000, maximumAge: 24 * 3600 * 1000 }
    );
  });
}

async function fromNetwork() {
  try {
    const r = await fetch('https://ipwho.is/', { cache: 'no-store' });
    const d = await r.json();
    if (d && d.success && d.latitude) {
      return { lat: d.latitude, lon: d.longitude, name: d.city || d.region, src: 'net' };
    }
  } catch (e) {}
  return null;
}

async function nameFor(s) {
  if (s.name) return s.name;
  try {
    const r = await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client'
      + '?latitude=' + s.lat + '&longitude=' + s.lon + '&localityLanguage=en');
    const d = await r.json();
    return d.locality || d.city || d.principalSubdivision || null;
  } catch (e) { return null; }
}

async function resolveLocation() {
  if (params.get('lat') && params.get('lon')) {
    return { lat: parseFloat(params.get('lat')), lon: parseFloat(params.get('lon')),
             name: params.get('name'), src: 'manual' };
  }
  const saved = recall();
  if (saved && saved.lat) return saved;

  setStatus('Finding your location');
  const found = await fromGPS() || await fromNetwork();
  if (!found) return Object.assign({ src: 'fallback' }, FALLBACK);

  found.name = await nameFor(found);
  remember(found);
  return found;
}

function weatherUrl(s) {
  return 'https://api.open-meteo.com/v1/forecast'
    + '?latitude=' + s.lat.toFixed(4) + '&longitude=' + s.lon.toFixed(4)
    + '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day'
    + '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset'
    + '&timezone=auto&forecast_days=1'
    + '&temperature_unit=' + UNITS.temp + '&wind_speed_unit=' + UNITS.wind;
}

async function loadWeather() {
  if (!spot) return;
  try {
    const res = await fetch(weatherUrl(spot), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();

    const c = d.current, day = d.daily;
    const code = c.weather_code;
    const meta = WX[code] || ['—', 'cloud'];

    el.icon.innerHTML = '<svg viewBox="0 0 100 116">' + icon(meta[1], c.is_day === 1) + '</svg>';
    el.temp.innerHTML = Math.round(c.temperature_2m) + '<span>°</span>';
    el.cond.textContent = meta[0];
    el.feels.textContent = Math.round(c.apparent_temperature) + '°';
    el.hilo.textContent = Math.round(day.temperature_2m_max[0]) + '° / ' + Math.round(day.temperature_2m_min[0]) + '°';
    el.pop.textContent = (day.precipitation_probability_max[0] ?? 0) + '%';
    el.wind.textContent = Math.round(c.wind_speed_10m) + ' mph';

    sunrise = new Date(day.sunrise[0]);
    sunset  = new Date(day.sunset[0]);
    el.rise.textContent = pad(sunrise.getHours()) + pad(sunrise.getMinutes());
    el.set.textContent  = pad(sunset.getHours()) + pad(sunset.getMinutes());

    lastGood = new Date();
    setStatus('');
    moveMarker(new Date());
  } catch (err) {
    setStatus(lastGood
      ? 'Weather last updated ' + pad(lastGood.getHours()) + ':' + pad(lastGood.getMinutes())
      : 'No connection — check Wi-Fi', true);
  }
}

function setStatus(text, warn) {
  el.status.textContent = text;
  el.status.className = warn ? 'warn' : '';
}

/* Marker walks the daylight band; the band dims once the sun is down. */
function moveMarker(now) {
  if (!sunrise || !sunset) return;
  const span = sunset - sunrise;
  const frac = Math.min(1, Math.max(0, (now - sunrise) / span));
  const daylight = now >= sunrise && now <= sunset;

  const left = 6 + frac * 88;
  el.band.style.left = '6%';
  el.band.style.width = (frac * 88) + '%';
  el.band.style.opacity = daylight ? '1' : '0.35';
  el.marker.style.left = left + '%';
  el.marker.style.opacity = daylight ? '1' : '0.4';
}

/* ---------- Loops ---------- */
drawClock();

(async function start() {
  spot = await resolveLocation();
  el.place.textContent = spot.name
    || (spot.lat.toFixed(2) + ', ' + spot.lon.toFixed(2));
  loadWeather();
})();

// Tick exactly on the minute so the digits never lag.
(function schedule() {
  const ms = 60000 - (Date.now() % 60000);
  setTimeout(function () { drawClock(); schedule(); }, ms + 40);
})();

setInterval(loadWeather, 10 * 60 * 1000);
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) { drawClock(); loadWeather(); }
});
</script>
</body>
</html>
